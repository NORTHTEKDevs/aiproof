name: Feature request
description: New rule, new parser, new output format, new CLI flag, etc.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where aiproof falls short for you.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would ideal behavior look like? Include CLI invocation, config keys, or expected output if relevant.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you've tried.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope hint
      options:
        - label: This would be a new rule (propose the rule code + what it catches)
        - label: This needs a new parser or SDK pattern
        - label: This changes existing behavior (breaking?)
        - label: This is doc / DX polish only
