[package]
name = "aiproof-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for aiproof, the static analyzer for AI prompts (ESLint for prompts)."
repository = { workspace = true }
readme = "README.md"
keywords = ["llm", "linter", "prompts", "static-analysis", "ai"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "aiproof"
path = "src/main.rs"

[dependencies]
aiproof-core = { path = "../aiproof-core", version = "0.1.4" }
aiproof-parse = { path = "../aiproof-parse", version = "0.1.4" }
aiproof-rules = { path = "../aiproof-rules", version = "0.1.4" }
aiproof-config = { path = "../aiproof-config", version = "0.1.4" }
aiproof-report = { path = "../aiproof-report", version = "0.1.4" }
clap           = { workspace = true }
ignore         = { workspace = true }
glob           = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile   = { workspace = true }
predicates = "3"
criterion = { workspace = true }

[[bench]]
name = "single_file"
harness = false
