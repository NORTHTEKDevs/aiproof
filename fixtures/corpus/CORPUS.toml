# Pinned snapshots of real-world AI projects. Used for aiproof's regression
# corpus and false-positive budget gates. Run `scripts/sync_corpus.sh` to
# materialize these under fixtures/corpus/<name>/ at the exact commit.
#
# SHAs pinned 2026-04-24 from each repo's HEAD at corpus-sync time.
# To update a pin: cd fixtures/corpus/<name> && git fetch && git rev-parse origin/HEAD,
# then replace the sha field below.

